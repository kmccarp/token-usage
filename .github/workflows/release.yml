name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: build
        run: |
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/token-usage-${target%/*}-${target#*/}" ./cmd/token-usage
          done
          cd dist && sha256sum token-usage-* > SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
